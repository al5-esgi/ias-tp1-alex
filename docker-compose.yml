version: "3"

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

  rustfs-permissions:
    image: alpine:3.20
    command: chown -R 10001:10001 /data/rustfs0 /logs
    volumes:
      - rustfs_data_0:/data/rustfs0
      - logs:/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-minio99}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-minio123}
      - RUSTFS_OBJECT_CACHE_ENABLE=true
    volumes:
      - rustfs_data_0:/data/rustfs0
      - logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tp1_network

  debian-ssh:
    build:
      context: ./debian-ssh
      args:
        SSH_USER: ${SSH_USER:-debian}
    image: tp1/debian-ssh
    container_name: debian-ssh
    hostname: debian-ssh
    ports:
      - "2222:22"
    environment:
      - SSH_PASSWORD=${SSH_PASSWORD:-debian}
    restart: unless-stopped
    networks:
      - tp1_network

networks:
  tp1_network:
    driver: bridge

volumes:
  rustfs_data_0:
  logs:
  floci-data:
